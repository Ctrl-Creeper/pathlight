name: Bug Report
description: Report reproducible Pathlight bug.
labels:
  - bug
  - needs-triage
body:
  - type: dropdown
    id: affected_area
    attributes:
      label: Affected Area
      description: Pick the closest part of Pathlight.
      options:
        - Live Monitor
        - Long-term watches
        - Activity history / dashboard
        - Recorded sizes / exclusion patterns
        - Alerts / notifications
        - Menu bar
        - Settings / storage and retention
        - Windows or Linux window
        - Command line (pathlight-monitor)
        - Install, update, launch at login, uninstall
        - Crash or hang
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What broke?
      placeholder: A file I deleted in a watched folder never appeared in its history.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the actions that trigger the bug.
      placeholder: |
        1. Open Pathlight
        2. Watch a folder
        3. Change a file inside it
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should Pathlight do instead?
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      description: How often can you reproduce this?
      options:
        - Every time
        - Often
        - Sometimes
        - Once
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Host
      description: Which Pathlight was running?
      options:
        - macOS app
        - Windows window
        - Linux window
        - Command line
    validations:
      required: true

  - type: input
    id: pathlight_version
    attributes:
      label: Pathlight Version
      description: App release where bug occurred (About Pathlight, or `pathlight-monitor --version`).
      placeholder: 1.5.0
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: Operating System
      placeholder: macOS 26.5.1, Windows 11 24H2, Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, Crash Report, Screenshots, or Diagnostics
      description: Attach relevant evidence. Be mindful of private paths and file names.
      render: text
    validations:
      required: false

  - type: textarea
    id: regression
    attributes:
      label: Regression
      description: If this worked before, which Pathlight version or commit last worked?
      placeholder: Worked in v1.0.0, broken on main@abc1234.
    validations:
      required: false
