name: Feature Request
description: Suggest a focused Pathlight improvement.
labels:
  - enhancement
  - needs-triage
body:
  - type: dropdown
    id: affected_area
    attributes:
      label: Affected Area
      description: Pick the closest part of Pathlight.
      options:
        - Live Monitor
        - Long-term watches
        - Activity history / dashboard
        - Recorded sizes / exclusion patterns
        - Alerts / notifications
        - Menu bar
        - Settings / storage and retention
        - Windows or Linux window
        - Command line (pathlight-monitor)
        - Install, update, launch at login, uninstall
        - Crash or hang
        - Other
    validations:
      required: true

  - type: dropdown
    id: request_type
    attributes:
      label: Request Type
      description: What kind of improvement is this?
      options:
        - New feature
        - Existing feature improvement
        - Performance improvement
        - Accessibility improvement
        - Workflow or usability improvement
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should Pathlight support or improve?
      placeholder: Pathlight should let me compare two weeks of a watched folder's history.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Why is this improvement needed?
      placeholder: After a large cleanup, I cannot tell which folders grew again without reading the history row by row.
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the behavior you want. Include UI details if they matter.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add screenshots, mockups, links, or examples. Be mindful of private paths and file names.
    validations:
      required: false
