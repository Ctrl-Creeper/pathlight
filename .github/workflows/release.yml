# Every artifact is built on the OS it runs on. No cross-compilation, because a
# Windows window that only ever linked on a Linux runner is a window nobody has
# seen start.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows x86_64, slug: windows-x86_64 }
          - { os: ubuntu-latest, name: Linux x86_64, slug: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux windowing libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Build the window
        working-directory: gui
        run: cargo build --release
      - name: Build the recorder
        working-directory: core
        run: cargo build --release --bin pathlight-monitor
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          dir="pathlight-${TAG}-${{ matrix.slug }}"
          mkdir "$dir"
          if [ "$RUNNER_OS" = Windows ]; then
            cp gui/target/release/pathlight.exe core/target/release/pathlight-monitor.exe "$dir/"
          else
            cp gui/target/release/pathlight core/target/release/pathlight-monitor "$dir/"
          fi
          cp README.md core/PLATFORMS.md "$dir/"
          echo "STAGED=$dir" >> "$GITHUB_ENV"
      # `tar` and `Compress-Archive` ship with their platform; an archiver that
      # has to be installed first is a release step that fails on a bad day.
      - if: runner.os != 'Windows'
        run: tar czf "$STAGED.tar.gz" "$STAGED"
      - if: runner.os == 'Windows'
        run: Compress-Archive -Path "$env:STAGED" -DestinationPath "$env:STAGED.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  macos-app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build universal xcframework
        run: core/scripts/build-xcframework.sh
      - name: Build app
        run: >
          xcodebuild -project Pathlight.xcodeproj -scheme Pathlight
          -configuration Release -destination 'platform=macOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build the recorder
        working-directory: core
        run: cargo build --release --bin pathlight-monitor
      - name: Package
        run: |
          set -euo pipefail
          dir="pathlight-${TAG}-macos"
          mkdir "$dir"
          cp -R build/Build/Products/Release/Pathlight.app "$dir/"
          cp core/target/release/pathlight-monitor README.md core/PLATFORMS.md "$dir/"
          # `ditto`, not `zip`: it is the one archiver that keeps a bundle's
          # symlinks and resource forks intact.
          ditto -c -k --sequesterRsrc --keepParent "$dir" "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: "*.zip"
          if-no-files-found: error

  publish:
    name: Publish pre-release
    needs: [desktop, macos-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Pathlight $TAG" --notes-file .github/release-notes.md \
            artifacts/*
