# Actions are pinned to commits, with the tag they were at in the comment: a
# tag is a name its owner can move, and a workflow that signs and notarizes
# builds is a workflow whose steps must not change under it. Moving a pin is a
# commit, which is the point.
# Every artifact is built on the OS it runs on. No cross-compilation, because a
# Windows window that only ever linked on a Linux runner is a window nobody has
# seen start.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows x86_64, slug: windows-x86_64 }
          - { os: ubuntu-latest, name: Linux x86_64, slug: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install Linux windowing libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - name: Build the window
        working-directory: gui
        run: cargo build --release
      - name: Build the recorder
        working-directory: core
        run: cargo build --release --bin pathlight-monitor
      # Two archives per platform: the app, which bundles the command, and the
      # command on its own. A server that will never open a window should not
      # have to download a GPU-drawn one to record a folder.
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          app="pathlight-${TAG}-${{ matrix.slug }}"
          cli="pathlight-cli-${TAG}-${{ matrix.slug }}"
          mkdir "$app" "$cli"
          cp "gui/target/release/pathlight$exe" "$app/"
          cp "core/target/release/pathlight-monitor$exe" "$app/"
          cp "core/target/release/pathlight-monitor$exe" "$cli/"
          cp README.md core/PLATFORMS.md "$app/"
          cp core/PLATFORMS.md "$cli/"
          echo "APP=$app" >> "$GITHUB_ENV"
          echo "CLI=$cli" >> "$GITHUB_ENV"
      # `tar` and `Compress-Archive` ship with their platform; an archiver that
      # has to be installed first is a release step that fails on a bad day.
      - if: runner.os != 'Windows'
        run: |
          tar czf "$APP.tar.gz" "$APP"
          tar czf "$CLI.tar.gz" "$CLI"
      - if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path $env:APP -DestinationPath "$env:APP.zip"
          Compress-Archive -Path $env:CLI -DestinationPath "$env:CLI.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.slug }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  macos-app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build universal xcframework
        run: core/scripts/build-xcframework.sh
      - name: Build app
        run: >
          xcodebuild -project Pathlight.xcodeproj -scheme Pathlight
          -configuration Release -destination 'platform=macOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build the recorder
        working-directory: core
        run: cargo build --release --bin pathlight-monitor
      - name: Package
        run: |
          set -euo pipefail
          app="pathlight-${TAG}-macos"
          cli="pathlight-cli-${TAG}-macos"
          mkdir "$app" "$cli"
          cp -R build/Build/Products/Release/Pathlight.app "$app/"
          # Inside the bundle, not beside it: dragging the app to
          # /Applications is the whole macOS install, and a loose binary next
          # to it does not come along. `pathlight-monitor install-cli` from
          # there puts it on a PATH. Nothing is signed in this pipeline, so
          # there is no signature to invalidate.
          cp core/target/release/pathlight-monitor "$app/Pathlight.app/Contents/MacOS/"
          cp README.md core/PLATFORMS.md "$app/"
          cp core/target/release/pathlight-monitor core/PLATFORMS.md "$cli/"
          # `ditto`, not `zip`: it is the one archiver that keeps a bundle's
          # symlinks and resource forks intact.
          ditto -c -k --sequesterRsrc --keepParent "$app" "$app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$cli" "$cli.zip"
          # The update feed points at an archive holding the app and nothing
          # else. The staging folders above carry a README and PLATFORMS.md,
          # which are not part of an update, and the reader that writes the
          # feed expects one bundle in the archive it reads.
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/Pathlight.app "Pathlight-${TAG}.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: "*.zip"
          if-no-files-found: error
      # Sparkle reads a feed, and this repository writes it. A feed on a host
      # nobody commits to is a feed that stops answering one day with no diff
      # here to say so, which is what happened to the domain this file used to
      # name.
      - name: Write the update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "SPARKLE_PRIVATE_KEY is not set, so no feed is written."
            echo "The app finds no update until it is, and that is not a build failure."
            exit 0
          fi
          # The tools come from the Sparkle the app already links against
          # (Package.resolved pins 2.9.4), by version and by checksum, for the
          # same reason the actions above are pinned to commits.
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.4/Sparkle-2.9.4.tar.xz"
          echo "ce89daf967db1e1893ed3ebd67575ed82d3902563e3191ca92aaec9164fbdef9  $RUNNER_TEMP/sparkle.tar.xz" \
            | shasum -a 256 --check --status
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP"
          feed="$RUNNER_TEMP/feed"
          mkdir "$feed"
          cp "Pathlight-${TAG}.zip" "$feed/"
          # `--ed-key-file -` is the path Sparkle documents for a key that
          # lives in a secret: it arrives on standard input and is never
          # written to a file on the runner.
          # The archive the feed names is this tag's own release asset, so the
          # download prefix is that release rather than wherever the feed
          # itself ends up being served from.
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | (
            cd "$feed"
            "$RUNNER_TEMP/bin/generate_appcast" \
              --ed-key-file - \
              --link "https://github.com/${GITHUB_REPOSITORY}" \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
              .
          )
          cp "$feed/appcast.xml" appcast.xml
      # `ignore`, not `error`: with no key there is no feed, and that is the
      # state this repository is in until one exists. A tag should still ship.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appcast
          path: appcast.xml
          if-no-files-found: ignore

  publish:
    name: Publish pre-release
    needs: [desktop, macos-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Pathlight $TAG" --notes-file .github/release-notes.md \
            artifacts/*

      # The feed the app reads lives under its own tag, so its URL never
      # moves and only SUFeedURL has to name it. It is republished after the
      # release it describes, so the archive it points at is already
      # downloadable by the time anything reads the feed. The release itself
      # keeps a copy of the feed it published, beside the builds it names.
      - name: Republish the update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f artifacts/appcast.xml ]; then
            echo "No feed in this release: SPARKLE_PRIVATE_KEY is not set, so there is nothing to republish."
            exit 0
          fi
          gh release view appcast --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create appcast --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Update feed" \
              --notes "The Sparkle feed the app reads. Rewritten by release.yml on every tag; it carries no build of its own."
          gh release upload appcast artifacts/appcast.xml --repo "$GITHUB_REPOSITORY" --clobber
