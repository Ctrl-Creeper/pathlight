# Actions are pinned to commits, with the tag they were at in the comment: a
# tag is a name its owner can move, and a workflow that signs and notarizes
# builds is a workflow whose steps must not change under it. Moving a pin is a
# commit, which is the point.
# Every artifact is built on the OS it runs on. No cross-compilation, because a
# Windows window that only ever linked on a Linux runner is a window nobody has
# seen start.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows x86_64, slug: windows-x86_64 }
          - { os: ubuntu-latest, name: Linux x86_64, slug: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install Linux windowing libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - name: Build the window
        working-directory: gui
        run: cargo build --release
      - name: Build the recorder
        working-directory: core
        run: cargo build --release --bin pathlight-monitor
      # Two archives per platform: the app, which bundles the command, and the
      # command on its own. A server that will never open a window should not
      # have to download a GPU-drawn one to record a folder.
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          app="pathlight-${TAG}-${{ matrix.slug }}"
          cli="pathlight-cli-${TAG}-${{ matrix.slug }}"
          mkdir "$app" "$cli"
          cp "gui/target/release/pathlight$exe" "$app/"
          cp "core/target/release/pathlight-monitor$exe" "$app/"
          cp "core/target/release/pathlight-monitor$exe" "$cli/"
          cp README.md core/PLATFORMS.md "$app/"
          cp core/PLATFORMS.md "$cli/"
          echo "APP=$app" >> "$GITHUB_ENV"
          echo "CLI=$cli" >> "$GITHUB_ENV"
      # `tar` and `Compress-Archive` ship with their platform; an archiver that
      # has to be installed first is a release step that fails on a bad day.
      - if: runner.os != 'Windows'
        run: |
          tar czf "$APP.tar.gz" "$APP"
          tar czf "$CLI.tar.gz" "$CLI"
      - if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path $env:APP -DestinationPath "$env:APP.zip"
          Compress-Archive -Path $env:CLI -DestinationPath "$env:CLI.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.slug }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  macos-app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build universal xcframework
        run: core/scripts/build-xcframework.sh
      - name: Build app
        run: >
          xcodebuild -project Pathlight.xcodeproj -scheme Pathlight
          -configuration Release -destination 'platform=macOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build the recorder
        working-directory: core
        run: cargo build --release --bin pathlight-monitor
      - name: Package
        run: |
          set -euo pipefail
          app="pathlight-${TAG}-macos"
          cli="pathlight-cli-${TAG}-macos"
          mkdir "$app" "$cli"
          cp -R build/Build/Products/Release/Pathlight.app "$app/"
          # Inside the bundle, not beside it: dragging the app to
          # /Applications is the whole macOS install, and a loose binary next
          # to it does not come along. `pathlight-monitor install-cli` from
          # there puts it on a PATH. Nothing is signed in this pipeline, so
          # there is no signature to invalidate.
          cp core/target/release/pathlight-monitor "$app/Pathlight.app/Contents/MacOS/"
          cp README.md core/PLATFORMS.md "$app/"
          cp core/target/release/pathlight-monitor core/PLATFORMS.md "$cli/"
          # `ditto`, not `zip`: it is the one archiver that keeps a bundle's
          # symlinks and resource forks intact.
          ditto -c -k --sequesterRsrc --keepParent "$app" "$app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$cli" "$cli.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: "*.zip"
          if-no-files-found: error

  publish:
    name: Publish pre-release
    needs: [desktop, macos-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Pathlight $TAG" --notes-file .github/release-notes.md \
            artifacts/*
