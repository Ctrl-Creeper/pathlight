name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # fanotify needs CAP_SYS_ADMIN, so the unprivileged run above exercises
      # inotify and this one exercises the backend nobody can reach on a normal
      # desktop without sudo. Same contract, both privilege levels. The binary
      # is run directly: `sudo cargo` would rebuild everything as root.
      - name: Watcher contract as root (fanotify)
        if: runner.os == 'Linux'
        run: |
          binary=$(cargo test --test monitor --no-run --message-format=json \
            | python3 -c 'import json,sys; print(next(json.loads(line)["executable"] for line in sys.stdin if line.startswith("{") and json.loads(line).get("executable") and json.loads(line)["target"]["name"] == "monitor"))')
          sudo PATHLIGHT_PRIVILEGED_WATCH=1 "$binary" --test-threads=1
      # A change journal is not a property of NTFS, it is a thing an
      # administrator turns on, and Windows only keeps one on the system
      # volume. The runner's work disk is not that volume, so the second pass
      # below would test the fallback and prove nothing. Creating one is
      # idempotent; the query prints what the backend is about to read.
      - name: Give the work volume a change journal
        if: runner.os == 'Windows'
        run: |
          $drive = (Get-Location).Drive.Name + ":"
          fsutil fsinfo volumeinfo $drive
          fsutil usn createjournal m=32000000 a=8000000 $drive
          fsutil usn queryjournal $drive
      # The change journal needs a volume handle, which only an administrator
      # can open. Hosted Windows runners already run elevated, so this is the
      # same second pass as above with no escalation step.
      - name: Watcher contract as administrator (USN journal)
        if: runner.os == 'Windows'
        env:
          PATHLIGHT_PRIVILEGED_WATCH: '1'
        run: cargo test --test monitor -- --test-threads=1

  desktop-shell:
    name: Desktop shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui
      # The windowing libraries eframe links against, plus the gtk and
      # AppIndicator ones the tray icon needs: a tray item on Linux is a gtk
      # widget talking StatusNotifierItem, and there is no portal for it the
      # way there is for the folder picker.
      - name: Install Linux windowing libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libwayland-dev libgl1-mesa-dev
          libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The interface tests drive the real widgets through accesskit, so this is
      # where a Windows or Linux window is shown to work without one to look at.
      - run: cargo test
      # Release only here: it is the profile that ships, and the one where
      # `windows_subsystem` decides whether a console window appears.
      - if: runner.os == 'Windows'
        run: cargo build --release

  swift-package:
    name: Swift package tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test

  macos-app:
    name: macOS app (Rust core + Xcode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build universal xcframework
        run: core/scripts/build-xcframework.sh
      - name: Build app
        run: >
          xcodebuild -project Pathlight.xcodeproj -scheme Pathlight
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          | xcbeautify --renderer github-actions || true
      # The binary, not the bundle directory: Xcode creates the `.app` early
      # enough that a build which failed to compile still leaves one behind, so
      # checking the directory let a broken build pass.
      - name: Verify build result
        run: test -x build/Build/Products/Debug/Pathlight.app/Contents/MacOS/Pathlight
