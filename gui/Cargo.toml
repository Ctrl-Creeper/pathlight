[package]
name = "pathlight-gui"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pathlight's cross-platform desktop shell (Windows and Linux)"

[[bin]]
name = "pathlight"
path = "src/main.rs"

[dependencies]
pathlight-core = { path = "../core" }
# accesskit stays on: it is what exposes the window to a screen reader.
eframe = "0.36"
# Native folder picker. `xdg-portal` instead of the default GTK3 bindings: the
# portal is the dialog a sandboxed app gets either way, and the picker has no
# reason to hold a second gtk stack open just to ask for a folder.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The tray icon that keeps the app reachable after its window closes. A tray
# item is a different protocol on every desktop (StatusNotifierItem,
# Shell_NotifyIcon, NSStatusItem) with no portal or stdlib equivalent, and
# this is the one crate that speaks all three.
tray-icon = "0.24.2"
# Desktop notifications: the only way a watch can speak after its window is
# closed. Three unrelated APIs underneath (XDG notifications, WinRT toasts,
# NSUserNotification) and no stdlib anything. `z` is zbus, so the Linux side
# needs no libdbus headers; the default `serde` and `async` features are not
# used here. Turning notifications off stays the desktop's own setting.
notify-rust = { version = "4.18.0", default-features = false, features = ["z"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", default-features = false }
tempfile = "3.27.0"

# Only to give tray-icon's Linux widget the gtk main loop it requires; the
# folder picker still avoids gtk through xdg-portal. tray-icon already pulls
# gtk 0.18 in via libappindicator, so this follows its pin rather than
# choosing a second one.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
