[package]
name = "pathlight-gui"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pathlight's cross-platform desktop shell (Windows and Linux)"

[[bin]]
name = "pathlight"
path = "src/main.rs"

[dependencies]
pathlight-core = { path = "../core" }
# accesskit stays on: it is what exposes the window to a screen reader.
eframe = "0.36"
# Native folder picker. `xdg-portal` instead of the default GTK3 bindings so a
# Linux build needs no gtk development headers.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
egui_kittest = { version = "0.36.2", default-features = false }
tempfile = "3.27.0"
