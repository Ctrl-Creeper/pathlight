# Hardware AES and carry-less multiply on Apple silicon and other ARMv8: the
# aes and polyval crates only use them when asked, and the software path made
# reading an encrypted journal several times slower than it has to be.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]
